<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Model Viewer UI – Left Rail + Slide Drawer</title>
  <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css" />

  <style>

html, body {
  height: 100%;
}


/* 기존 viewerRoot 스타일 */
#viewerRoot{
  height:100%;
  width:100%;
  position:relative;
  display:block;
  overflow:hidden;
}

   
  </style>

  <!-- <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script> -->
  <script src="./cesium/Cesium.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script src="./dist/GIT.js"></script> 
   <script src="./src/MapLayer.js"></script>
</head>
<body>
<div id="viewerRoot">
</div>
    
</body>

  <script type="module">
  import CesiumViewer from './src/index.js';    
  var gitViewer = gitViewer || {};
  const config = {
    tilesetUrls:[

    
    ],
     info: {
                text: "test",
                iconSrc: "./src/under.png",
                longitude: undefined,
                latitude: undefined,
                length: 100,
                destination: {
                    longitude: 126.87345863222825, 
                    latitude: 37.52793533575197, 
                    height: 20.7866826672040563
                },
                orientation: {
                    heading: 1.568291123130754,
                    pitch: -0.10286155859012203,
                    roll: 0,
                }
            },
    terrain: "",
    baseLayer : ""
  };
 (async function() {
  window.app = await CesiumViewer("#viewerRoot", config);
  MapLayer({
      cesiumViewer: window.app.viewer,
      options: {
              'SA001': { path: '/geojson/SA001.geojson', color: '#0000ff' },
              'SB001': { path: '/geojson/SB001.geojson', color: '#ff0000' }
      },
      toolBar: app.toolbarApi()
  });
 })(); 
</script>
